services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ronnstore
    ports:
      - "5432:5432"
    volumes:
      - ronnstore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ronnstore"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ronnstore_pg: